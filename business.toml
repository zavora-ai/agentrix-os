site_name = "Agentrix OS"
site_description = "The agentic operating system that works while you live — spatial field UI with live agent orchestration."
domain = "localhost:9847"
contact = "hello@zavora.example"

[business]
name = "Zavora"
country = "US"
languages = ["en"]
currency = "USD"
timezone = "America/Los_Angeles"

[brand_voice]
tone = "warm, confident, quietly witty"
greeting = "I'm synced and ready — tell me what you'd like to do, or tap Start my day."
escalation_message = "Let me connect you with the Zavora team."

[[capabilities]]
name = "submit_intent"
description = "Submit a natural-language intent and receive live orchestration events"
endpoint = "/api/sessions/{session_id}/intent"
method = "POST"
access_level = "anonymous"

[[capabilities]]
name = "create_session"
description = "Create an ephemeral browser session"
endpoint = "/api/sessions"
method = "POST"
access_level = "anonymous"

[[capabilities]]
name = "list_artifacts"
description = "Download session artifacts (.xlsx, .docx, .pptx)"
endpoint = "/artifacts/{user_id}/{session_id}/{filename}"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "build_deck"
description = "Build a pitch deck via parallel excel+docs then slides MCP agents"
endpoint = "/api/sessions/{session_id}/intent"
method = "POST"
access_level = "anonymous"

[[capabilities]]
name = "chat_mother"
description = "Conversational turn with the Mother Agent — same orchestration pipeline as submit_intent, with per-session chat history (GET returns the transcript)"
endpoint = "/api/sessions/{session_id}/chat"
method = "POST"
access_level = "anonymous"

[[capabilities]]
name = "list_actions"
description = "Pending actions awaiting approval (and GET /api/audit — the audit log of executed, queued and denied effects)"
endpoint = "/api/actions"
method = "GET"
access_level = "known"

[[capabilities]]
name = "approve_action"
description = "Approve, reject or edit a pending action (POST /api/actions/{id}/approve|reject|edit; POST /api/actions/approve for a batch). Approval executes the tool with the user as the authority and writes an audit row"
endpoint = "/api/actions/{action_id}/approve"
method = "POST"
access_level = "known"

[[capabilities]]
name = "get_permissions"
description = "Every agent's authority mode (observe | suggest | automate), tool effect classes and overrides, plus the pause state"
endpoint = "/api/permissions"
method = "GET"
access_level = "known"

[[capabilities]]
name = "set_permissions"
description = "Set an agent's mode or a per-tool override"
endpoint = "/api/permissions"
method = "PUT"
access_level = "known"

[[capabilities]]
name = "pause_agents"
description = "Pause every write for all agents or one world (POST /api/pause), resume with POST /api/resume; pausing everything also sets DND"
endpoint = "/api/pause"
method = "POST"
access_level = "known"

[[capabilities]]
name = "record_ui_events"
description = "Content-free UI signals (focus, notification counts, card opens per domain) for the activity ledger"
endpoint = "/api/sessions/{session_id}/events"
method = "POST"
access_level = "anonymous"

[[capabilities]]
name = "manage_memory"
description = "Personal memory — list (GET), state a fact (POST → known), confirm or correct (PATCH /api/memory/{id}), forget (DELETE /api/memory/{id}), export (GET /api/memory/export), delete everything (DELETE). Every item shows kind = known | assumed | recommended and its provenance"
endpoint = "/api/memory"
method = "GET"
access_level = "known"

[[capabilities]]
name = "submit_action"
description = "Submit an action turn (combine, handle it, …) and receive conduct SSE events"
endpoint = "/api/sessions/{session_id}/action"
method = "POST"
access_level = "known"

[[capabilities]]
name = "get_greeting"
description = "Personalized greeting from integration facts (calendar, email, news, weather) via greeting agent; honest brand voice when no integrations are connected"
endpoint = "/api/greeting"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "list_cards"
description = "Hydrate field cards after refresh"
endpoint = "/api/sessions/{session_id}/cards"
method = "GET"
access_level = "known"

[[capabilities]]
name = "list_agents"
description = "Hydrate agent rails after refresh"
endpoint = "/api/sessions/{session_id}/agents"
method = "GET"
access_level = "known"

[[capabilities]]
name = "snooze_agent"
description = "Snooze an agent to the Resting rail"
endpoint = "/api/agents/{agent_id}/snooze"
method = "POST"
access_level = "known"

[[capabilities]]
name = "wake_agent"
description = "Wake an agent from Resting to Active"
endpoint = "/api/agents/{agent_id}/wake"
method = "POST"
access_level = "known"

[[capabilities]]
name = "commit_action"
description = "Execute a card primary action (draft, save, book, …)"
endpoint = "/api/sessions/{session_id}/commit"
method = "POST"
access_level = "known"

[[capabilities]]
name = "start_morning"
description = "Start my day — parallel calendar+inbox then brief via MCP agents"
endpoint = "/api/sessions/{session_id}/intent"
method = "POST"
access_level = "anonymous"

[[capabilities]]
name = "fuse_cards"
description = "Fuse one card into another — server-driven conduct gesture"
endpoint = "/api/sessions/{session_id}/fuse"
method = "POST"
access_level = "known"

[[capabilities]]
name = "subscribe_proactive"
description = "Subscribe to AWP webhook events when background agents complete work"
endpoint = "/awp/events/subscribe"
method = "POST"
access_level = "known"

[[capabilities]]
name = "stream_voice"
description = "WebSocket stream for Suzy live voice (mic PCM in, spoken PCM out); submit_intent tool runs orchestration in background"
endpoint = "/ws/voice"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "voice_status"
description = "Whether Gemini Live voice is configured and sample rates for the client bridge"
endpoint = "/api/voice/status"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "stream_ambient"
description = "SSE stream of proactive agent rail updates (research, scout, maker)"
endpoint = "/api/ambient"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "ambient_status"
description = "Snapshot of proactive agent states and DND flag"
endpoint = "/api/ambient/status"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "get_people"
description = "People rail tiles from Slack when connected; honest empty state otherwise"
endpoint = "/api/people"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "get_live"
description = "Live headline carousel from mcp-news (Hacker News, GNews)"
endpoint = "/api/live"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "get_rails_background"
description = "Server-driven ambient flank cards built from people, live, and proactive state"
endpoint = "/api/rails/background"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "google_oauth"
description = "Sign in with Google — sets ax_session JWT cookie"
endpoint = "/api/auth/google"
method = "GET"
access_level = "anonymous"

[[capabilities]]
name = "auth_profile"
description = "Current authenticated user profile"
endpoint = "/api/auth/me"
method = "GET"
access_level = "known"

[[capabilities]]
name = "list_tasks"
description = "Tasks store shared by Work Productivity and Home Personal Productivity — open tasks, deadlines, focus sessions and postponement counts across both worlds (S4-T3)"
endpoint = "/api/tasks"
method = "GET"
access_level = "known"

[[capabilities]]
name = "manage_consents"
description = "Consents per category (calendar, email, health, finance, social, location, reading, routines) and world; GET lists them, PUT grants or revokes one (S11-T4)"
endpoint = "/api/consents"
method = "GET"
access_level = "known"

[[policies]]
name = "privacy"
description = "Sessions persist to Postgres when DATABASE_URL is set; otherwise in-memory per process. The activity ledger is content-free (hashed subjects, counts and durations only); pending-action arguments are the only stored content and are held for at most 48 hours after resolution."
policy_type = "privacy"

[[policies]]
name = "rate-limiting"
description = "Anonymous: 60 req/min per IP for intent submission."
policy_type = "rate-limiting"

[support]
escalation_contacts = ["hello@zavora.example"]
hours = "24/7 (demo)"
sla = "best-effort"