[package]
name = "spatial-os"
version = "0.1.0"
edition = "2024"
# `cargo run` must keep starting the server now that src/bin/load_ledger.rs exists (R1).
default-run = "spatial-os"

[lib]
name = "spatial_os"
path = "src/lib.rs"

[dependencies]
adk-agent = { path = "../adk-rust/adk-agent", features = ["ambient"] }
adk-awp = { path = "../adk-rust/adk-awp" }
awp-types = { path = "../adk-rust/awp-types" }
arc-swap = "1"
adk-core = { path = "../adk-rust/adk-core" }
adk-model = { path = "../adk-rust/adk-model", features = ["gemini", "anthropic"] }
adk-realtime = { path = "../adk-rust/adk-realtime", features = ["gemini"] }
adk-runner = { path = "../adk-rust/adk-runner" }
adk-session = { path = "../adk-rust/adk-session" }
adk-tool = { path = "../adk-rust/adk-tool", features = ["mcp"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
http-body-util = "0.1"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
dotenvy = "0.15"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"

[dev-dependencies]
adk-awp = { path = "../adk-rust/adk-awp" }
adk-core = { path = "../adk-rust/adk-core" }
adk-session = { path = "../adk-rust/adk-session" }
awp-types = { path = "../adk-rust/awp-types" }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }