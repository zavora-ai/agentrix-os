# MCP Registry-compatible tool allowlists per sub-agent (BK-011).
# Discovery ≠ exposure: agents only receive tools listed for their agent id.
#
# Phase 2 (ADR-002/003): each entry also declares the agent's `world` (work|home|shared),
# its default `mode` (observe|suggest|automate) and, from S2, an `[allowlist.effects]` table
# classifying every tool (read | write_local | schedule_with_others | send_external |
# publish_public | financial | delete). Missing mode → suggest; missing world → shared.

# Built-in memory tools (S3-T3) are mounted in-process on every agent and on the Mother. They
# pass the same permission gate as MCP tools, so they are classified once here: observe denies
# `propose_memory`, pause blocks it, and every call is audited and ledgered. Boot fails if a
# built-in tool is missing from this table.
[builtin_effects]
read_memory = "read"
propose_memory = "write_local"

[[allowlist]]
agent = "excel_agent"
world = "work"
mode = "suggest"
mcp_server = "worksheet"
reason = "Deck revenue spreadsheet — write-only workbook tools"
tools = [
  "create_workbook",
  "open_workbook",
  "save_workbook",
  "write_cells",
  "write_column",
  "write_row",
  "add_chart",
  "describe_workbook",
  "list_sheets",
  "set_cell_format",
]

[allowlist.effects]
create_workbook = "write_local"
open_workbook = "read"
save_workbook = "write_local"
write_cells = "write_local"
write_column = "write_local"
write_row = "write_local"
add_chart = "write_local"
describe_workbook = "read"
list_sheets = "read"
set_cell_format = "write_local"

