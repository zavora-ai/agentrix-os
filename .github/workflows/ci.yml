name: CI

on:
  push:
    branches: [main, 'milestone/**', 'phase2/**', 'docs/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spatial_os
          POSTGRES_PASSWORD: spatial_os
          POSTGRES_DB: spatial_os
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U spatial_os -d spatial_os"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://spatial_os:spatial_os@localhost:5434/spatial_os
      # Exposed as env so the live-test step can test for it: the `secrets` context is not
      # allowed in a step-level `if`, and that one line made GitHub reject the whole workflow
      # (every run since M11 "failed" in 0 s with no jobs).
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone adk-rust (path dependency)
        run: git clone --depth 1 https://github.com/zavora-ai/adk-rust.git ../adk-rust

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets

      # libtest filters are substrings, not regexes — pass each as its own argument.
      - name: cargo test (unit)
        run: cargo test --lib

      # The Postgres tests expect the schema to exist; the service container starts empty.
      - name: apply migrations to the Postgres service
        run: cargo run --bin migrate

      - name: cargo test (offline validate)
        run: >
          cargo test --test validate --
          awp_gate business_toml mock_deck combine_action keyword_router artifact_paths
          session_store voice_state greeting_brand background_cards ambient_store tour_prompts
          proactive_mock mcp_allowlist health_exposes
          postgres_schema ui_session_persists pg_agent_session
          domain_ intake_ mother_ ledger_ permission_ gate_ pending_ memory_ effects_
          consent_ tasks_ s7_

      - name: cargo test (live — optional secrets)
        if: env.GOOGLE_API_KEY != ''
        run: cargo test --test validate -- gemini_ router_agent suzy_agent mother_agent_builds

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: spatial-os

      - name: Clone adk-rust
        run: git clone --depth 1 https://github.com/zavora-ai/adk-rust.git adk-rust
        working-directory: spatial-os/..

      - name: Docker build
        run: docker build -f spatial-os/Dockerfile -t agentrix-os:ci .
        working-directory: spatial-os/..